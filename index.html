<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garden</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<style>
:root{
  --paper:#f4ecd8; --card:#fffdf7; --ink:#2f2a20; --muted:#6b5540; --line:#d8cdb4;
  --soil:#4a3826; --tomato:#c9603f; --peabean:#6f8f5a; --cuke:#d9a441;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --paper:#211b14; --card:#2c241b; --ink:#efe6d0; --muted:#bca98a; --line:#4a3d2e; --soil:#e8ddc7; }
}
:root[data-theme="dark"]{ --paper:#211b14; --card:#2c241b; --ink:#efe6d0; --muted:#bca98a; --line:#4a3d2e; --soil:#e8ddc7; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif;line-height:1.5}
main{max-width:40rem;margin:0 auto;padding:3rem 1.25rem 4rem}
header{display:flex;gap:1.25rem;align-items:center;margin-bottom:2.5rem}
.plot{flex:none;width:72px;height:72px;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;
  padding:4px;border:2px solid var(--soil);border-radius:3px}
.plot span{border-radius:1px}
h1{margin:0;font-size:2.25rem;line-height:1.1;font-weight:normal}
header p{margin:.25rem 0 0;color:var(--muted)}
nav{display:grid;gap:.75rem}
nav a{display:block;padding:1rem 1.25rem;background:var(--card);color:inherit;text-decoration:none;
  border:1px solid var(--line);border-left:6px solid var(--c);border-radius:4px}
nav a:hover{border-color:var(--c)}
nav a:focus-visible{outline:3px solid var(--c);outline-offset:2px}
nav strong{display:block;font-size:1.2rem;font-weight:normal}
nav small{display:block;color:var(--muted);font-size:.95rem;margin-top:.15rem}
footer{margin-top:2.5rem;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
  <header>
    <div class="plot" aria-hidden="true">
      <span style="background:#c9603f"></span><span style="background:#b8562f"></span><span style="background:#d9a441"></span><span style="background:#c98a2b"></span>
      <span style="background:#8a6d3b"></span><span style="background:#6f8f5a"></span><span style="background:#7a8c4a"></span><span style="background:#7a8c4a"></span>
      <span style="background:#b56b4f"></span><span style="background:#b56b4f"></span><span style="background:#7a8c4a"></span><span style="background:#7a8c4a"></span>
      <span style="background:#5f7a52"></span><span style="background:#c9a13a"></span><span style="background:#5c4a38"></span><span style="background:#d8cdb4"></span>
    </div>
    <div>
      <h1>Garden</h1>
      <p>20×20 ft hybrid plot, Central New York, Zone 5b</p>
    </div>
  </header>
  <nav>
    <a href="https://caseymwalsh.github.io/garden/layout.html" style="--c:var(--tomato)">
      <strong>Garden layout</strong>
      <small>Grid map, plant counts, and planting schedule</small>
    </a>
    <a href="https://caseymwalsh.github.io/garden/varieties.html" style="--c:var(--peabean)">
      <strong>Plant varieties</strong>
      <small>Variety picks and details for every plant</small>
    </a>
    <a href="https://caseymwalsh.github.io/garden/bed-diagrams.html" style="--c:var(--cuke)">
      <strong>Bed planting diagrams</strong>
      <small>Spacing diagrams for each bed and zone</small>
    </a>
  </nav>
  <footer>Last frost ~May 20, first fall frost ~early October</footer>
</main>
</body>
</html>
